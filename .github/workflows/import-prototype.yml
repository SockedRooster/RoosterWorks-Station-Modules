name: Import Station Modules v0.4.0 developer source

on:
  push:
    branches: [main]
    paths:
      - 'RoosterWorks-Station-Modules-v0.4.0-Developer-Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact developer source archive and import project
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from hashlib import sha256
          archive=Path('RoosterWorks-Station-Modules-v0.4.0-Developer-Source.zip')
          if not archive.exists():
              print('Developer archive not uploaded; no import needed.')
              raise SystemExit(0)
          assert sha256(archive.read_bytes()).hexdigest()=='3cba0f5fad24b55ae7fc2f96750dab30d7d17b56a9f2116dc3a458300020f0e5', 'Unexpected source ZIP SHA-256'
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Damaged source ZIP'
              entries=[entry for entry in z.infolist() if not entry.is_dir()]
              names=[entry.filename for entry in entries]
              assert len(names)==66 and len(set(names))==66, 'Expected 66 unique developer files'
              required={
                'README.md','CHANGELOG.md','LICENSE','CHECKSUMS-SHA256.txt',
                'GameData/RoosterWorksStationModules/Parts/RW_HAB_250.cfg',
                'GameData/RoosterWorksStationModules/Parts/RW_LAB_250.cfg',
                'GameData/RoosterWorksStationModules/Parts/RW_CMD_250.cfg',
                'GameData/RoosterWorksStationModules/Models/RW_CMD_250.mu',
                'GameData/RoosterWorksStationModules/Compatibility/LabKerbalism.cfg',
                'GameData/RoosterWorksStationModules/Compatibility/CommandKerbalism.cfg',
                'Source/build_cmd250.py',
                'Source/Blender/create_cmd250.py',
                'Tools/validate.py',
                'Tools/validate_cmd250.py',
                'Media/RW-CMD-250-v0.4.0-Review-Render.png'
              }
              assert required.issubset(set(names)), 'Missing approved developer files'
              for entry in entries:
                  name=entry.filename
                  assert not name.startswith('/') and not name.startswith('.') and '\\' not in name and '..' not in PurePosixPath(name).parts, 'Unsafe ZIP entry'
                  assert ((entry.external_attr>>16)&0o170000)!=0o120000, 'Symlink forbidden'
                  assert name in {'README.md','CHANGELOG.md','LICENSE','CHECKSUMS-SHA256.txt'} or name.startswith(('GameData/RoosterWorksStationModules/','Source/','Tools/','Media/')), 'Unexpected file path'
              for entry in entries:
                  path=Path(entry.filename)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(z.read(entry))
          print('Approved prototype source extracted:',len(entries),'files')
          PY
      - name: Install validator prerequisites
        run: python -m pip install Pillow
      - name: Run three-module offline checks
        run: |
          python Tools/validate.py
          sha256sum --check CHECKSUMS-SHA256.txt
      - name: Commit approved source and remove temporary import archive
        run: |
          if [ ! -f 'RoosterWorks-Station-Modules-v0.4.0-Developer-Source.zip' ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md LICENSE CHECKSUMS-SHA256.txt GameData/ Source/ Tools/ Media/
          git rm -f 'RoosterWorks-Station-Modules-v0.4.0-Developer-Source.zip'
          git commit -m 'Import Station Modules v0.4.0 LAB science and CMD prototype'
          git push origin HEAD:main
