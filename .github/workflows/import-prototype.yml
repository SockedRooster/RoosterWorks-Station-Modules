name: Import RW-HAB-250 v0.2.4 developer source

on:
  push:
    branches: [main]
    paths:
      - 'RoosterWorks-Station-Modules-v0.2.4-Developer-Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved source ZIP and extract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from hashlib import sha256
          from zipfile import ZipFile
          archive=Path('RoosterWorks-Station-Modules-v0.2.4-Developer-Source.zip')
          if not archive.is_file():
              print('Developer source ZIP not uploaded; nothing to import.')
              raise SystemExit(0)
          assert sha256(archive.read_bytes()).hexdigest()=='41cedb10f16020474be7c8036a033455838111d94b39ad17f3082d8567517d5f', 'Unexpected source ZIP SHA-256'
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Damaged source ZIP'
              names=[item.filename for item in z.infolist() if not item.is_dir()]
              assert len(names)==33 and len(set(names))==33, 'Expected exactly 33 distinct source files'
              for name in names:
                  path=PurePosixPath(name)
                  assert not name.startswith('/') and not name.startswith('.') and '..' not in path.parts and '\\' not in name, 'Unsafe filename'
                  assert name in ('README.md','CHANGELOG.md','LICENSE','CHECKSUMS-SHA256.txt') or name.startswith(('GameData/RoosterWorksStationModules/','Source/','Tools/','Media/')), 'Unexpected source path'
              required={
                  'GameData/RoosterWorksStationModules/Models/RW_HAB_250.mu',
                  'GameData/RoosterWorksStationModules/Models/rwm_crest.png',
                  'GameData/RoosterWorksStationModules/Parts/RW_HAB_250.cfg',
                  'Source/build_hab250.py',
                  'Source/Blender/create_hab250.py',
                  'Source/Blender/RW_HAB_250.obj',
                  'Source/Blender/RW_HAB_250_SideHatch.obj',
                  'Tools/validate.py',
                  'Media/RW-HAB-250-v0.2.4-Review-Render.png'
              }
              assert required.issubset(set(names)), 'Required model/source files missing'
              for name in names:
                  out=Path(name)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(z.read(name))
          print('Imported',len(names),'files from approved prototype')
          PY
      - name: Validate geometry, hatch rail, crest and Kerbalism config
        run: |
          python Tools/validate.py
          sha256sum --check CHECKSUMS-SHA256.txt
      - name: Commit verified source and remove import ZIP
        run: |
          if [ ! -f 'RoosterWorks-Station-Modules-v0.2.4-Developer-Source.zip' ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md LICENSE CHECKSUMS-SHA256.txt GameData/ Source/ Tools/ Media/
          git rm -f 'RoosterWorks-Station-Modules-v0.2.4-Developer-Source.zip'
          git commit -m 'Import RW-HAB-250 v0.2.4 hatch rail, crest and seating fixes'
          git push origin HEAD:main
