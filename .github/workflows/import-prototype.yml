name: Import RW-HAB-250 prototype v0.2 sources

on:
  push:
    branches: [main]
    paths:
      - 'RoosterWorks-Station-Modules-v0.2.0-Developer-Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact model source ZIP and extract
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path, PurePosixPath
          from hashlib import sha256
          root=Path.cwd()
          archive=root/'RoosterWorks-Station-Modules-v0.2.0-Developer-Source.zip'
          if not archive.is_file():
              print('Source archive not uploaded yet; nothing to import.')
              raise SystemExit(0)
          approved_digest='e43ee10dfac583a402d0bb1a85f74e952503c09f10177e735ced06abbb07cf32'
          assert sha256(archive.read_bytes()).hexdigest()==approved_digest, 'Unexpected archive hash'
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Corrupt archive'
              names=[e.filename for e in z.infolist() if not e.is_dir()]
              assert len(names)==28 and len(set(names))==28, 'Expected 28 unique files'
              assert all(not n.startswith('/') and not n.startswith('.') and
                         '..' not in PurePosixPath(n).parts and '\\' not in n
                         for n in names), 'Unsafe ZIP path'
              assert all(n in ('README.md','CHANGELOG.md','LICENSE','CHECKSUMS-SHA256.txt') or
                         n.startswith(('Source/','Tools/','Media/','GameData/RoosterWorksStationModules/'))
                         for n in names), 'Unexpected file path'
              assert 'Source/build_hab250.py' in names
              assert 'Source/Blender/create_hab250.py' in names
              assert 'GameData/RoosterWorksStationModules/Models/RW_HAB_250.mu' in names
              assert 'Media/RW-HAB-250-v0.2.0-Review-Render.png' in names
              for name in names:
                  dest=root/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(name))
          print('Imported model source files:',len(names))
          PY

      - name: Validate geometry and resource configurations
        run: |
          if [ -f Tools/validate.py ]; then python Tools/validate.py; fi
          if [ -f CHECKSUMS-SHA256.txt ]; then sha256sum -c CHECKSUMS-SHA256.txt; fi

      - name: Commit verified prototype and remove one-time ZIP
        run: |
          if [ ! -f RoosterWorks-Station-Modules-v0.2.0-Developer-Source.zip ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md CHECKSUMS-SHA256.txt LICENSE GameData/ Source/ Tools/ Media/
          git rm -f RoosterWorks-Station-Modules-v0.2.0-Developer-Source.zip
          git commit -m 'Import detailed flush-endcap HAB-250 v0.2 prototype'
          git push origin HEAD:main
