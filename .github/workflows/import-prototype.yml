name: Import Station Modules v0.4.3 developer source

on:
  push:
    branches: [main]
    paths:
      - 'RoosterWorks-Station-Modules-v0.4.3-Developer-Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack exact approved developer ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from hashlib import sha256
          from zipfile import ZipFile
          f=Path('RoosterWorks-Station-Modules-v0.4.3-Developer-Source.zip')
          if not f.is_file():
              print('No approved developer ZIP uploaded; skipping import.')
              raise SystemExit(0)
          assert sha256(f.read_bytes()).hexdigest()=='b9293b73388fd1da7d2aca21579234b6ada8121b9fd400da60a89f31adcc552f', 'Developer ZIP checksum mismatch'
          with ZipFile(f) as z:
              assert z.testzip() is None, 'Corrupt ZIP'
              entries=[e for e in z.infolist() if not e.is_dir()]
              names=[e.filename for e in entries]
              assert len(entries)==67 and len(names)==len(set(names)), 'Expected 67 unique source files'
              required={
                  'GameData/RoosterWorksStationModules/Parts/RW_HAB_250.cfg',
                  'GameData/RoosterWorksStationModules/Parts/RW_LAB_250.cfg',
                  'GameData/RoosterWorksStationModules/Parts/RW_CMD_250.cfg',
                  'GameData/RoosterWorksStationModules/Models/RW_HAB_250.mu',
                  'GameData/RoosterWorksStationModules/Models/RW_CMD_250.mu',
                  'Tools/validate.py','Tools/validate_eva_airlock.py',
                  'Source/build_hab250.py','Source/build_cmd250.py',
                  'README.md','LICENSE','CHANGELOG.md','CHECKSUMS-SHA256.txt'
              }
              assert required.issubset(set(names)), 'A necessary source file is missing'
              for e in entries:
                  n=e.filename
                  assert n and not n.startswith(('/', '.')) and '\\' not in n and '..' not in PurePosixPath(n).parts, 'Unsafe ZIP path'
                  assert ((e.external_attr>>16)&0o170000)!=0o120000, 'Symlinks forbidden'
                  assert n in {'README.md','LICENSE','CHANGELOG.md','CHECKSUMS-SHA256.txt'} or n.startswith(('GameData/RoosterWorksStationModules/','Source/','Tools/','Media/')), 'Unexpected path'
              for e in entries:
                  target=Path(e.filename)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(e))
          PY
      - name: Install test prerequisites
        run: python -m pip install Pillow
      - name: Verify native parts, configs and SHA-256 manifest
        run: |
          python Tools/validate.py
          sha256sum --check CHECKSUMS-SHA256.txt
      - name: Commit verified source and remove temporary archive
        run: |
          if [ ! -f 'RoosterWorks-Station-Modules-v0.4.3-Developer-Source.zip' ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE CHANGELOG.md CHECKSUMS-SHA256.txt GameData/ Source/ Tools/ Media/
          git rm -f 'RoosterWorks-Station-Modules-v0.4.3-Developer-Source.zip'
          git commit -m 'Import Station Modules v0.4.3 EVA initialization and CMD control point'
          git push origin HEAD:main
