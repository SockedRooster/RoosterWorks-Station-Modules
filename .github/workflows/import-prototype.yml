name: Import RW-HAB-250 v0.2.7 source

on:
  push:
    branches: [main]
    paths:
      - 'RoosterWorks-Station-Modules-v0.2.7-Developer-Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archive and safely extract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from hashlib import sha256
          archive=Path('RoosterWorks-Station-Modules-v0.2.7-Developer-Source.zip')
          if not archive.is_file():
              print('No v0.2.7 source upload; nothing to import.')
              raise SystemExit(0)
          assert sha256(archive.read_bytes()).hexdigest()=='9c7d012fb0943886e207c24cd3596c92e823135482af1350ecee86d471140e71', 'Archive SHA-256 mismatch'
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Corrupt archive'
              entries=[i for i in z.infolist() if not i.is_dir()]
              names=[i.filename for i in entries]
              assert len(entries)==35 and len(set(names))==35, 'Expect 35 unique files'
              mandatory={
                'README.md','LICENSE','CHANGELOG.md','CHECKSUMS-SHA256.txt',
                'GameData/RoosterWorksStationModules/Models/RW_HAB_250.mu',
                'GameData/RoosterWorksStationModules/Models/rwm_cabin_emissive.png',
                'GameData/RoosterWorksStationModules/Parts/RW_HAB_250.cfg',
                'Source/build_hab250.py','Source/Blender/create_hab250.py',
                'Source/Blender/RW_HAB_250.obj','Source/Blender/RW_HAB_250_SideHatch.obj',
                'Tools/validate.py','Media/Closeup-Standard.png','Media/Closeup-SideHatch.png'
              }
              assert mandatory.issubset(set(names)), 'Missing expected sources'
              for item in entries:
                  n=item.filename
                  assert not n.startswith('/') and not n.startswith('.') and '..' not in PurePosixPath(n).parts and '\\' not in n, 'Unsafe ZIP filename'
                  assert ((item.external_attr >> 16) & 0o170000) != 0o120000, 'No symlinks'
                  assert n in ('README.md','LICENSE','CHANGELOG.md','CHECKSUMS-SHA256.txt') or n.startswith(('GameData/RoosterWorksStationModules/','Source/','Tools/','Media/')), 'Unexpected path'
              for item in entries:
                  p=Path(item.filename)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(item))
          PY
      - name: Run geometry and resource checks
        run: |
          python Tools/validate.py
          sha256sum -c CHECKSUMS-SHA256.txt
      - name: Commit v0.2.7 source and remove one-time archive
        run: |
          if [ ! -f 'RoosterWorks-Station-Modules-v0.2.7-Developer-Source.zip' ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE CHANGELOG.md CHECKSUMS-SHA256.txt GameData/ Source/ Tools/ Media/
          git rm -f 'RoosterWorks-Station-Modules-v0.2.7-Developer-Source.zip'
          git commit -m 'Import HAB-250 v0.2.7 conformal window and hatch geometry'
          git push origin HEAD:main
