name: Import Station Modules v0.3.0 development source

on:
  push:
    branches: [main]
    paths:
      - 'RoosterWorks-Station-Modules-v0.3.0-Developer-Source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact developer ZIP and safely unpack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from hashlib import sha256
          archive=Path('RoosterWorks-Station-Modules-v0.3.0-Developer-Source.zip')
          if not archive.is_file():
              print('No v0.3.0 import ZIP yet; skipping.')
              raise SystemExit(0)
          actual=sha256(archive.read_bytes()).hexdigest()
          assert actual=='26e72393e4bb58a832673a09e7c02a0a70dcf0ed63fb67b76bf595552589d29b', f'Wrong developer ZIP digest: {actual}'
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'Corrupt source ZIP'
              entries=[i for i in z.infolist() if not i.is_dir()]
              names=[i.filename for i in entries]
              assert len(entries)==51 and len(set(names))==51, 'Expected 51 unique files'
              required={
                'README.md', 'CHANGELOG.md', 'LICENSE', 'CHECKSUMS-SHA256.txt',
                'GameData/RoosterWorksStationModules/Models/RW_HAB_250.mu',
                'GameData/RoosterWorksStationModules/Models/RW_LAB_250.mu',
                'GameData/RoosterWorksStationModules/Parts/RW_HAB_250.cfg',
                'GameData/RoosterWorksStationModules/Parts/RW_LAB_250.cfg',
                'GameData/RoosterWorksStationModules/Compatibility/LabKerbalism.cfg',
                'Source/build_hab250.py', 'Source/build_lab250.py',
                'Source/Blender/RW_LAB_250.obj', 'Source/Blender/create_lab250.py',
                'Tools/validate.py', 'Tools/validate_hab250.py',
                'Tools/validate_lab250.py',
                'Media/RW-LAB-250-v0.3.0-Review-Render.png'
              }
              assert required.issubset(names), 'Missing required source files'
              for info in entries:
                  name=info.filename
                  p=PurePosixPath(name)
                  assert not name.startswith('/') and not name.startswith('.') and '..' not in p.parts and '\\' not in name, 'Unsafe source path'
                  assert ((info.external_attr >> 16) & 0o170000)!=0o120000, 'Symlink not allowed'
                  assert name in ('README.md','LICENSE','CHANGELOG.md','CHECKSUMS-SHA256.txt') or name.startswith(('GameData/RoosterWorksStationModules/','Source/','Tools/','Media/')), 'Unexpected path'
              for info in entries:
                  p=Path(info.filename)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(info))
          print('Imported',len(entries),'files')
          PY
      - name: Static verification of both modules and source hashes
        run: |
          python Tools/validate.py
          sha256sum -c CHECKSUMS-SHA256.txt
      - name: Commit assets and remove temporary ZIP
        run: |
          if [ ! -f 'RoosterWorks-Station-Modules-v0.3.0-Developer-Source.zip' ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md LICENSE CHECKSUMS-SHA256.txt GameData/ Source/ Tools/ Media/
          git rm -f 'RoosterWorks-Station-Modules-v0.3.0-Developer-Source.zip'
          git commit -m 'Import Station Modules v0.3.0: HAB-250 and LAB-250'
          git push origin HEAD:main
