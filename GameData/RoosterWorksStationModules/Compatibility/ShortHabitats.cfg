// True compact geometry; two seats; balanced storage and usable hatch.
@PART[RW_HABS_250]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 18
        %maxAmount = 18
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 9
        %maxAmount = 9
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 2500
        %maxAmount = 2500
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 1000
        %maxAmount = 1000
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 20
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 12.5
    }
}

@PART[RW_HABS_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 6.75
        %surface = 24.33333333
    }
}

@PART[RW_HABS_250]:NEEDS[VABOrganizer]:FINAL
{
    %category = Utility
    !VABORGANIZER,*
    {
    }
    VABORGANIZER
    {
        organizerSubcategory = crewHabitation
    }
}

