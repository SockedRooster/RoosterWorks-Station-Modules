// v0.1 prototype: use the actual active Kerbalism Default-profile resources.
// Upsert instead of appending duplicate resources if a Kerbalism crew patch
// already populated this part. Do not add resource definitions in stock KSP.
@PART[RW_HAB_250]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 36
        %maxAmount = 36
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 18
        %maxAmount = 18
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 5000
        %maxAmount = 5000
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 2000
        %maxAmount = 2000
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 40
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 25
    }
}

// Explicit geometry figures for Kerbalism habitation/pressure/stress, with
// FeatureHabitat gating and no extra comfort/recycler claims.
@PART[RW_HAB_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 13.5
        %surface = 36.5
    }
}
