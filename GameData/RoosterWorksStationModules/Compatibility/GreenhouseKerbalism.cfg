// Inherit the installed Default profile, including old harvest-based and newer
// continuous-production balance. MM node-copy syntax documented by sarbian.
// First copy, then modify in a separate patch so all edits target the new node.
@PART[RW_GRN_250]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    #@PART[kerbalism-greenhouse]/MODULE[Greenhouse] {}
}
@PART[RW_GRN_250]:HAS[@MODULE[Greenhouse]]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    @MODULE[Greenhouse]
    {
        @crop_size *= 0.5
        @ec_rate *= 0.5
        @INPUT_RESOURCE,*
        {
            @rate *= 0.5
        }
        @OUTPUT_RESOURCE,*
        {
            @rate *= 0.5
        }
        %lamps = RW_GreenhouseLamps
        %shutters =
        %plants =
        %active = false
    }
    // One renderer, one controller: Greenhouse owns lamp intensity and EC draw.
    !MODULE[ModuleColorChanger] {}
    MODULE
    {
        name = ProcessController
        resource = _PressureControl
        title = Pressure control
        capacity = 0.25
        running = true
    }
    RESOURCE
    {
        name = Food
        amount = 0
        maxAmount = 300
    }
    RESOURCE
    {
        name = Water
        amount = 40
        maxAmount = 40
    }
    RESOURCE
    {
        name = Ammonia
        amount = 200
        maxAmount = 200
    }
    RESOURCE
    {
        name = CarbonDioxide
        amount = 3000
        maxAmount = 3000
    }
    RESOURCE
    {
        name = Nitrogen
        amount = 2000
        maxAmount = 2000
    }
    RESOURCE
    {
        name = Oxygen
        amount = 0
        maxAmount = 6000
    }
}
@PART[RW_GRN_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 12
        %surface = 36
    }
}
