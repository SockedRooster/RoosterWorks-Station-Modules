// Stock swatches on existing cores; old reactor IDs retained for saves.
@PART[RW_PWR_250]:NEEDS[Kerbalism,ProfileDefault,CommunityResourcePack]:AFTER[RoosterWorksStationModules]
{
    %description = Power and service core with Battery / Nuclear editor variants. Battery 2980 EC; nuclear 2450 EC and 5.5 EC/s. Nuclear hardware replaces a battery bay and applies the current independent storage balance. Includes cooling and starts off. White/grey finish is independent.
    MODULE
    {
        name = ModulePartVariants
        baseVariant = Battery
        useMultipleDragCubes = false
        VARIANT
        {
            name = Battery
            displayName = Battery only
            primaryColor = #DDE1DF
            secondaryColor = #536675
            mass = 0
            cost = 0
        }
        VARIANT
        {
            name = Nuclear
            displayName = Integrated nuclear
            primaryColor = #D49A41
            secondaryColor = #536675
            mass = 0.0429
            cost = 11968
        }
    }
    MODULE
    {
        name = ProcessController
        resource = _RWCompactReactor
        title = Integrated nuclear reactor
        capacity = 0
        running = false
        toggle = true
        valve_i = 0
    }
    MODULE
    {
        name = ModuleRWPowerVariant
        batteryCapacity = 2980
        reactorCapacity = 2450
        reactorScale = 1.1
    }
}

