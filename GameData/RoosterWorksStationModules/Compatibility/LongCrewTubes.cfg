@PART[RW_TUBL_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 10.63617609
        %surface = 28.44020997
    }
}

@PART[RW_TUBL_250]:HAS[!MODULE[ModuleConnectedLivingSpace]]:NEEDS[ConnectedLivingSpace]
{
    MODULE
    {
        name = ModuleConnectedLivingSpace
        passable = true
    }
}

@PART[RW_TUBL_250]:NEEDS[VABOrganizer]:FINAL
{
    %category = Structural
    !VABORGANIZER,*
    {
    }
    VABORGANIZER
    {
        organizerSubcategory = crewTubes
    }
}

@PART[RW_TUBL_250]:HAS[!MODULE[ModuleRWStationFinish]]:FOR[RoosterWorksStationModules]
{
    MODULE
    {
        name = ModuleRWStationFinish
        finish = White
    }
}

