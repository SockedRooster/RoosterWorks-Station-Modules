// Fixed-hub life support; visual rotation grants no automatic comfort bonus.
@PART[RW_GRAV_250]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 60.8
        %maxAmount = 60.8
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 30.4
        %maxAmount = 30.4
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 8437.5
        %maxAmount = 8437.5
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 5725.1
        %maxAmount = 5725.1
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 67.5
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 40.5
    }
}

@PART[RW_GRAV_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 12
        %surface = 37
    }
}

@PART[RW_GRAV_250]:NEEDS[CommunityTechTree]:AFTER[CommunityTechTree]
{
    @TechRequired = longTermHabitation
}
