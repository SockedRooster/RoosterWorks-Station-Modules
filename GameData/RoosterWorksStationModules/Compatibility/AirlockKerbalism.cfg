// Dedicated EVA staging chamber. Normal Kerbalism pressure/EVA rules apply;
// this patch does not create a bespoke pumping or air-recovery simulation.
@PART[RW_AIR_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 6
        %surface = 20
    }
}
