// Explicit limits after the Kerbalism/default drive passes; MB uses decimal GB.
@PART[RW_CMD_250,RW_CMD_375]:NEEDS[Kerbalism,FeatureScience]:FINAL
{
    %MODULE[HardDrive]
    {
        %name = HardDrive
        %dataCapacity = 2500
        %effectiveDataCapacity = 2500
        %maxDataCapacityFactor = 1
    }
}

@PART[RW_LAB_250,RW_LAB_375]:NEEDS[Kerbalism,FeatureScience]:FINAL
{
    %MODULE[HardDrive]
    {
        %name = HardDrive
        %dataCapacity = 2500
        %effectiveDataCapacity = 2500
        %maxDataCapacityFactor = 1
        %sampleCapacity = 100
        %effectiveSampleCapacity = 100
        %maxSampleCapacityFactor = 1
    }
}

@PART[RW_PWR_250_REACTOR]:FINAL
{
    @RESOURCE[ElectricCharge]
    {
        @amount = 2450
        @maxAmount = 2450
    }
}

@PART[RW_PWR_250]:NEEDS[!Kerbalism]:FINAL
{
    %description = Passive power and service core with 2980 EC storage. Current battery balance; white/grey exterior. Generation supplied separately.
}

@PART[RW_PWR_375_REACTOR]:FINAL
{
    @RESOURCE[ElectricCharge]
    {
        @amount = 4730
        @maxAmount = 4730
    }
}

@PART[RW_PWR_375]:NEEDS[!Kerbalism]:FINAL
{
    %description = Passive power and service core with 5740 EC storage. Current battery balance; white/grey exterior. Generation supplied separately.
}
