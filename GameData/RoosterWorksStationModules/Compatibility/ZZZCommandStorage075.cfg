// Command archives: five independent editor data tiers; no sample-storage changes.
// Decimal MB/GB; native Kerbalism selectors and persisted flight archives retained.
@PART[RW_CMD_250]:NEEDS[Kerbalism,FeatureScience]:FINAL
{
    %description = RoosterWorks 2.5 m station command core with retained control, communications, IVA and warm-white cabin lighting. Kerbalism editor data archive selectable from 200 to 1000 MB in five steps. White/Grey surface and independent ring colors; existing pressure, supply and electrical balance retained.
    %MODULE[HardDrive]
    {
        %name = HardDrive
        %dataCapacity = 200
        %effectiveDataCapacity = 200
        %maxDataCapacityFactor = 5
    }
}

