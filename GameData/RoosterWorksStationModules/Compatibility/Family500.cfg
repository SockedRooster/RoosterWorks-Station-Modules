@PART[RW_PWR_500]:NEEDS[Kerbalism,ProfileDefault,CommunityResourcePack]:AFTER[RoosterWorksStationModules]
{
    %description = 5 m power/service core. Battery 10200 EC; Nuclear 8410 EC, 6.5 EC/s, 1.95 fuel/waste capacity. Built-in cooling. White/Grey and ring color independent.
    MODULE
    {
        name = ModulePartVariants
        baseVariant = Battery
        useMultipleDragCubes = false
        VARIANT
        {
            name = Battery
            displayName = Battery only
            primaryColor = #DDE1DF
            secondaryColor = #536675
            mass = 0
            cost = 0
        }
        VARIANT
        {
            name = Nuclear
            displayName = Integrated nuclear
            primaryColor = #D49A41
            secondaryColor = #536675
            mass = 0.0507
            cost = 14144
        }
    }
    MODULE
    {
        name = ProcessController
        resource = _RWCompactReactor
        title = Integrated nuclear reactor
        capacity = 0
        running = false
        toggle = true
        valve_i = 0
    }
    MODULE
    {
        name = ModuleRWPowerVariant
        batteryCapacity = 10200
        reactorCapacity = 8410
        reactorScale = 1.3
    }
}

