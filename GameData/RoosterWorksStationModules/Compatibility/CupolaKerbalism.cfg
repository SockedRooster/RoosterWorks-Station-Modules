// Stock KSP installs need no Kerbalism resource definitions.
@PART[RW_CUP_250]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 6
        %maxAmount = 6
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 3
        %maxAmount = 3
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 900
        %maxAmount = 900
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 500
        %maxAmount = 500
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 6
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 4
    }
}
// Pressure/habitat volume only if Kerbalism's habitat feature is installed.
@PART[RW_CUP_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 6.2
        %surface = 17
    }
}
