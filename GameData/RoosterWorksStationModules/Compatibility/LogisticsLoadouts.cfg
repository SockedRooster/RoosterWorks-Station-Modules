// Editor-only custom selector; legacy mixed resources remain the default.
@PART[RW_LOG_250]:NEEDS[Kerbalism,ProfileDefault,CommunityResourcePack]:HAS[!MODULE[ModuleRWLogisticsContents]]:FOR[RoosterWorksStationModules]
{
    MODULE
    {
        name = ModuleRWLogisticsContents
        profileSet = RW_LOG_250
        contents = Mixed supplies
    }
}

