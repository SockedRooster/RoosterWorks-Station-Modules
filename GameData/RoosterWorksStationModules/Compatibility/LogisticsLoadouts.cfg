// Station-only loadout selector, calibrated per-resource capacities and volume scaling.
@PART[RW_LOG_250]:NEEDS[Kerbalism,ProfileDefault,CommunityResourcePack]:HAS[!MODULE[ModuleRWStationLogisticsContents]]:FOR[RoosterWorksStationModules]
{
    MODULE
    {
        name = ModuleRWStationLogisticsContents
        profileSet = RW_LOG_250
        contents = Mixed supplies
    }
}

