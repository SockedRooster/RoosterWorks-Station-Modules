// Passive storage for the Kerbalism Default profile. Not a recycler, ISRU or generator.
// Upsert each resource after the Default profile to avoid duplicate resource nodes.
@PART[RW_LOG_250]:NEEDS[Kerbalism,ProfileDefault]:AFTER[zzzKerbalismDefault]
{
    %RESOURCE[Food]
    {
        %name = Food
        %amount = 120
        %maxAmount = 120
    }
    %RESOURCE[Water]
    {
        %name = Water
        %amount = 60
        %maxAmount = 60
    }
    %RESOURCE[Oxygen]
    {
        %name = Oxygen
        %amount = 20000
        %maxAmount = 20000
    }
    %RESOURCE[Nitrogen]
    {
        %name = Nitrogen
        %amount = 8500
        %maxAmount = 8500
    }
    %RESOURCE[Waste]
    {
        %name = Waste
        %amount = 0
        %maxAmount = 120
    }
    %RESOURCE[WasteWater]
    {
        %name = WasteWater
        %amount = 0
        %maxAmount = 75
    }
}
// A pressurized, crew-transitable passage with zero assigned crew positions.
// Space comfort and machinery remain with dedicated habitat/lab parts.
@PART[RW_LOG_250]:NEEDS[Kerbalism,FeatureHabitat]:AFTER[zzzKerbalismDefault]
{
    %MODULE[Habitat]
    {
        %name = Habitat
        %volume = 12.5
        %surface = 34
    }
}
