// MB decimal; capacity scales with pressure volume; sample slots rounded per step.
@PART[RW_LAB_250]:NEEDS[Kerbalism,FeatureScience]:FINAL
{
    %description = RoosterWorks 2.5 m orbital science laboratory. Independent editor choices: 250 to 2500 MB data and 10 to 100 sample slots in ten steps. Warm-white cabin lighting, White/Grey finish and independent ring colors. Kerbalism experiments, pressure and supplies retained.
    %MODULE[HardDrive]
    {
        %name = HardDrive
        %dataCapacity = 250
        %effectiveDataCapacity = 250
        %maxDataCapacityFactor = 10
        %sampleCapacity = 10
        %effectiveSampleCapacity = 10
        %maxSampleCapacityFactor = 10
    }
    MODULE
    {
        name = ModuleRWScienceTiers
        volumeFactor = 1
    }
}

