PART
{
    name = RW_HAB_250
    module = Part
    author = SockedRooster

    MODEL
    {
        model = RoosterWorksStationModules/Models/RW_HAB_250
    }
    rescaleFactor = 1

    node_stack_top = 0, 1.980, 0, 0, 1, 0, 2
    node_stack_bottom = 0, -1.980, 0, 0, -1, 0, 2
    node_attach = 0, 0, -1.245, 0, 0, -1, 1
    attachRules = 1,1,1,1,0
    bulkheadProfiles = size2

    TechRequired = specializedConstruction
    entryCost = 24000
    cost = 14500
    category = Utility
    subcategory = 0
    title = RoosterWorks RW-HAB-250 Orbital Habitat
    manufacturer = RoosterWorks
    description = Pressurized four-crew orbital habitation module with integrated emergency battery and service volume. Default Kerbalism profile support adds roughly 30 Kerbin days of Food, Water and Oxygen storage for four crew. Features 50-percent larger square pressure windows, slim flush joint rings, the original RoosterWorks rooster crest, and selectable Standard / Side Hatch exterior variants. The Side Hatch variant clears the rail crossing the pressure-door face; window banks have cylinder-conforming frames seated within 3 mm of the hull, with true hull cutouts and curved glass. A solid convex hull prevents the EVA clearance ray from hitting a hollow wall collider. Exterior Side Hatch provides EVA access, boarding, grab rails and footholds. Standard Windows has no exterior exit; transfer crew to a module with a hatch for EVA. Warm-white window cabin glow can be toggled with stock KSP controls (lighting does not yet consume power). Custom interior is planned for a later release.
    tags = roosterworks station orbital crew habitation habitat kerbalism food oxygen water nitrogen life support

    mass = 3.5
    vesselType = Station
    CrewCapacity = 4
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 13
    breakingForce = 220
    breakingTorque = 220
    maxTemp = 2000
    skinMaxTemp = 2400
    fuelCrossFeed = True

    // Reuse the stock 4-seat cabin IVA temporarily. Unique interiors will
    // be developed after exterior, attach nodes and crew-transfer testing.
    INTERNAL
    {
        name = crewCabinInternals
    }

    MODULE
    {
        name = ModulePartVariants
        baseVariant = Standard
        baseMass = 0
        baseCost = 0
        useMultipleDragCubes = false
        VARIANT
        {
            name = Standard
            displayName = Standard Windows
            primaryColor = #E0E4E4
            secondaryColor = #536675
            GAMEOBJECTS
            {
                WindowBankStandard = true
                SideHatch = false
                            }
        }
        VARIANT
        {
            name = SideHatch
            displayName = Exterior Side Hatch
            primaryColor = #E0E4E4
            secondaryColor = #B88A4F
            GAMEOBJECTS
            {
                WindowBankStandard = false
                SideHatch = true
                            }
        }
    }

    // v0.4.6: register and gate the hatch and grab rail after variant selection.
    MODULE
    {
        name = ModuleRWStationHatch
    }

    // v0.4.6: runtime gates airlock, ladder and portrait EVA by variant.
    // Native triggers remain discoverable at Part.Awake; Standard has no exit.

    // Stock KSP warm-white cabin glow (no custom plugin or IVA required).
    // Targets ONLY glass meshes, leaving thermal overlays on the hull intact.
    // ModuleColorChanger persists its light state and supports the Lights group.
    // Power draw and power-loss interlocks require a later, compiled controller.
    MODULE
    {
        name = ModuleColorChanger
        moduleID = RW_HAB_250_CabinLights
        shaderProperty = _EmissiveColor
        includedRenderer = RW_GlassBase
        includedRenderer = RW_GlassStandard
        includedRenderer = RW_GlassSideHatch
        animRate = 0.65
        animState = false
        useRate = true
        toggleInEditor = true
        toggleInFlight = true
        unfocusedRange = 5
        toggleName = Toggle Cabin Lights
        eventOnName = Cabin Lights On
        eventOffName = Cabin Lights Off
        toggleAction = True
        defaultActionGroup = Light
        redCurve
        {
            key = 0 0
            key = 1 0.93
        }
        greenCurve
        {
            key = 0 0
            key = 1 0.84
        }
        blueCurve
        {
            key = 0 0
            key = 1 0.67
        }
        alphaCurve
        {
            key = 0 1
            key = 1 1
        }
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 1200
        maxAmount = 1200
    }
}
