    description = Large 3.75 m edition with the established crew capacity and equipment functions. Pressurized four-crew orbital habitation module with integrated emergency battery and service volume. Default Kerbalism profile support adds roughly 30 Kerbin days of Food, Water and Oxygen storage for four crew. Features 50-percent larger square pressure windows, slim flush joint rings, the original RoosterWorks rooster crest, and selectable Standard / Side Hatch exterior variants. The Side Hatch variant clears the rail crossing the pressure-door face; window banks have cylinder-conforming frames seated within 3 mm of the hull, with true hull cutouts and curved glass. A solid convex hull prevents the EVA clearance ray from hitting a hollow wall collider. Exterior Side Hatch provides EVA access, boarding, grab rails and footholds. Standard Windows has no exterior exit; transfer crew to a module with a hatch for EVA. Warm-white window cabin glow can be toggled with stock KSP controls (lighting does not yet consume power). Custom interior is planned for a later release.
