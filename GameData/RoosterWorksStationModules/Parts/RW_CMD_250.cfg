PART
{
    name = RW_CMD_250
    module = Part
    author = SockedRooster
    MODEL
    {
        model = RoosterWorksStationModules/Models/RW_CMD_250
    }
    rescaleFactor = 1
    node_stack_top = 0, 0.860, 0, 0, 1, 0, 2
    node_stack_bottom = 0, -0.860, 0, 0, -1, 0, 2
    node_attach = 0, 0, -1.235, 0, 0, -1, 1
    attachRules = 1,1,1,1,0
    bulkheadProfiles = size2
    TechRequired = specializedControl
    entryCost = 18750
    cost = 11750
    category = Pods
    subcategory = 0
    title = RoosterWorks RW-CMD-250 Compact Station Command
    manufacturer = RoosterWorks
    description = Compact 2.5 m station command deck. Two crew seats, integrated probe-capable station control, SAS, modest reaction-wheel authority, local communications and backup power. Five recessed panoramic viewports, a warm-white lighting toggle, and conditional Kerbalism-Default provisions. Flush 2.5 m top/bottom stack interfaces connect directly to RoosterWorks HAB/LAB. No built-in docking port, custom IVA or propulsion.
    tags = roosterworks command control station avionics sas probe cabin kerbalism electriccharge habitat
    mass = 2.2
    vesselType = Station
    CrewCapacity = 2
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 14
    breakingForce = 220
    breakingTorque = 220
    maxTemp = 2000
    skinMaxTemp = 2400
    fuelCrossFeed = True

    // Temporary stock 2-seat interior; custom Station Command IVA deferred.
    INTERNAL
    {
        name = mk2CockpitStandardInternals
    }

    MODULE
    {
        name = ModuleCommand
        // Integrated probe core, plus local control for any qualified crew.
        // Do not require a pilot specialization for an occupied station.
        minimumCrew = 0
        requiresPilot = false
        remoteControl = true
        requiresTelemetry = true
        // Hibernation can disable normal command authority.
        hasHibernation = false
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.035
        }
    }
    // v0.4.3 station control point pilot test (stock CommNet).
    // SSPXr station control cores use this module to establish crewed
    // control points. Unlike a transmitter, this is NOT a substitute for
    // the antenna's signal; confirms whether KSP lacked a control-point role.
    MODULE
    {
        name = ModuleProbeControlPoint
        minimumCrew = 1
        multiHop = True
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 2
    }
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 8
        YawTorque = 8
        RollTorque = 8
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.35
        }
    }
    // Short-range internal telemetry is essential for an integrated
    // probe-capable command module, even without an external antenna.
    // Kept separate from the existing 5 Mm DIRECT station radio.
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = INTERNAL
        antennaPower = 500000
        antennaCombinable = False
        packetInterval = 1
        packetSize = 0.2
        packetResourceCost = 0.5
        requiredResource = ElectricCharge
    }
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        antennaPower = 5000000
        antennaCombinable = True
        antennaCombinableExponent = 0.75
        packetInterval = 0.35
        packetSize = 2
        packetResourceCost = 10
        requiredResource = ElectricCharge
    }
    MODULE
    {
        name = ModuleColorChanger
        moduleID = RW_CMD_250_CabinLights
        shaderProperty = _EmissiveColor
        includedRenderer = RW_CmdGlass
        animRate = 0.65
        animState = false
        useRate = true
        toggleInEditor = true
        toggleInFlight = true
        unfocusedRange = 5
        toggleName = Toggle Command Cabin Lights
        eventOnName = Command Lights On
        eventOffName = Command Lights Off
        toggleAction = True
        defaultActionGroup = Light
        redCurve
        {
            key = 0 0
            key = 1 0.93
        }
        greenCurve
        {
            key = 0 0
            key = 1 0.84
        }
        blueCurve
        {
            key = 0 0
            key = 1 0.67
        }
        alphaCurve
        {
            key = 0 1
            key = 1 1
        }
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 2400
        maxAmount = 2400
    }
}
